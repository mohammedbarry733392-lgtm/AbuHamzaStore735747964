name: Build Abu Hamza Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbuHamzaStore_APK_Build_Ready-1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir -p project-unpacked
          unzip -o AbuHamzaStore_APK_Build_Ready-1.zip -d project-unpacked
          find project-unpacked -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname > project_path.txt
          test -s project_path.txt

      - name: Build APK
        run: |
          PROJECT_DIR="$(cat project_path.txt)"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuHamzaStore-APK
          path: project-unpacked/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
