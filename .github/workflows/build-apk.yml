      - name: Extract project
        shell: bash
        run: |
          mkdir -p project-unpacked
          unzip -o AbuHamzaStore_APK_Build_Ready-1.zip -d project-unpacked

          echo "===== Project files ====="
          find project-unpacked -maxdepth 5 -type f | sort | head -n 200

          GRADLEW=$(find project-unpacked -type f -name gradlew -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "Found Gradle Wrapper: $GRADLEW"
          else
            SETTINGS=$(find project-unpacked -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: No Gradle settings file found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "Gradle Wrapper not found. Will check whether system Gradle is available."
          fi

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle Wrapper is missing. Checking system Gradle..."
            if command -v gradle >/dev/null 2>&1; then
              gradle --no-daemon assembleDebug
            else
              echo "ERROR: The project does not contain gradlew, and system Gradle is unavailable."
              echo "Check the Project files output in the previous step."
              exit 1
            fi
          fi
