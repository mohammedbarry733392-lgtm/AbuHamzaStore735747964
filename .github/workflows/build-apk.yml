name: Build Abu Hamza Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbuHamzaStore_APK_Build_Ready-1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android platform tools
        run: sdkmanager "platform-tools"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project-unpacked

          unzip -o AbuHamzaStore_APK_Build_Ready-1.zip \
            -d project-unpacked

          echo "===== Project files ====="
          find project-unpacked -maxdepth 5 -type f \
            | sort | head -n 200

          GRADLEW=$(find project-unpacked \
            -type f -name gradlew -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          else
            SETTINGS=$(find project-unpacked -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Gradle settings file not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

            - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

            - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "===== Checking Gradle project ====="
          ls -la

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ERROR: Build configuration not found in project root."
            exit 1
          fi

          gradle --no-daemon assembleDebug
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuHamzaStore-APK
          path: project-unpacked/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
