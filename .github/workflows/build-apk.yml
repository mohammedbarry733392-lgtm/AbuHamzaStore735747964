name: Build Abu Hamza Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Select project ZIP
        id: select_zip
        shell: bash
        run: |
          if [ -f "AbuHamzaStore_Kotlin_Fixed.zip" ]; then
            echo "zip_file=AbuHamzaStore_Kotlin_Fixed.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "AbuHamzaStore_APK_Build_Ready-1.zip" ]; then
            echo "zip_file=AbuHamzaStore_APK_Build_Ready-1.zip" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: No project ZIP found."
            exit 1
          fi

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project-unpacked
          unzip -o "${{ steps.select_zip.outputs.zip_file }}" -d project-unpacked

          SETTINGS_FILE=$(find project-unpacked \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project
        run: |
          test -d "$PROJECT_DIR/app" || {
            echo "ERROR: app directory not found."
            exit 1
          }

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/AbuHamzaStore-debug.apk
          ls -lh output/AbuHamzaStore-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuHamzaStore-APK
          path: output/AbuHamzaStore-debug.apk
          if-no-files-found: error
          retention-days: 7
