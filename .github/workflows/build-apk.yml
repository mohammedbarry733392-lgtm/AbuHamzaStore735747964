name: Build Abu Hamza Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Select project ZIP
        id: select_zip
        shell: bash
        run: |
          if [ -f "AbuHamzaStore_Kotlin_Fixed.zip" ]; then
            echo "zip_file=AbuHamzaStore_Kotlin_Fixed.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "AbuHamzaStore_APK_Build_Ready-1.zip" ]; then
            echo "zip_file=AbuHamzaStore_APK_Build_Ready-1.zip" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project-unpacked

          unzip -o "${{ steps.select_zip.outputs.zip_file }}" \
            -d project-unpacked

          SETTINGS_FILE=$(find project-unpacked \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("project-unpacked")

          gradle_files = list(root.rglob("*.gradle"))
          gradle_files += list(root.rglob("*.gradle.kts"))

          for file in gradle_files:
              text = file.read_text(encoding="utf-8")
              original = text

              # Set Java source and target compatibility to Java 17.
              text = re.sub(
                  r'JavaVersion\.VERSION_1_8',
                  'JavaVersion.VERSION_17',
                  text
              )

              # Set Kotlin JVM target to 17 in common Gradle syntax.
              text = re.sub(
                  r'(?m)(jvmTarget\s*=\s*)["\']1\.8["\']',
                  r'\g<1>"17"',
                  text
              )

              text = re.sub(
                  r'(?m)(jvmTarget\s*=\s*)["\']8["\']',
                  r'\g<1>"17"',
                  text
              )

              # Handle Kotlin compilerOptions syntax.
              text = re.sub(
                  r'JvmTarget\.JVM_1_8',
                  'JvmTarget.JVM_17',
                  text
              )

              if text != original:
                  file.write_text(text, encoding="utf-8")
                  print(f"Updated JVM settings: {file}")
              else:
                  print(f"No matching JVM settings: {file}")
          PY

      - name: Check project files
        shell: bash
        run: |
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/AbuHamzaStore-debug.apk

          echo "APK generated successfully."
          ls -lh output/AbuHamzaStore-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuHamzaStore-APK
          path: output/AbuHamzaStore-debug.apk
          if-no-files-found: error
          retention-days: 7
