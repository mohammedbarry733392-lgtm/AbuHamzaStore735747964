name: Build Abu Hamza Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Kotlin project ZIP..."

          ZIP_FILE="$(find . -type f \
            -iname '*Kotlin*Fixed*.zip' \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Kotlin project ZIP not found."
            echo "Available ZIP files:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Found project: $ZIP_FILE"

          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "Extracted files:"
          find extracted-project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find extracted-project -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "No Gradle settings file found."
            echo "Checking for build.gradle files..."

            find extracted-project -type f \
              \( -name build.gradle \
              -o -name build.gradle.kts \) -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project directory: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.locate.outputs.project_dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuHamzaStore-APK
          path: extracted-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
