name: Build Abu Hamza Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Android Gradle project..."

          find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -not -path './.git/*' -print

          PROJECT_DIR=""

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            for file in $(find . -type f \( \
              -name settings.gradle \
              -o -name settings.gradle.kts \
            \) -not -path './.git/*'); do
              PROJECT_DIR="$(dirname "$file")"
              break
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found."
            echo "The Android project may still be inside a ZIP file."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuHamzaStore-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 14
