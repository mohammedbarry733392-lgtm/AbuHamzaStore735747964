name: Build Abu Hamza Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbuHamzaStore_Kotlin_Fixed.zip'
      - 'AbuHamzaStore_APK_Build_Ready-1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools"

      - name: Select project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "AbuHamzaStore_Kotlin_Fixed.zip" ]; then
            ZIP_FILE="AbuHamzaStore_Kotlin_Fixed.zip"
          elif [ -f "AbuHamzaStore_APK_Build_Ready-1.zip" ]; then
            ZIP_FILE="AbuHamzaStore_APK_Build_Ready-1.zip"
          else
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Selected project: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p project-unpacked
          unzip -o "$ZIP_FILE" -d project-unpacked

          SETTINGS=$(find project-unpacked -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

          find "$PROJECT_DIR" -maxdepth 4 -type f \
            | sort | head -n 200

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -d app ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f build.gradle ] \
            && [ ! -f build.gradle.kts ]; then
            echo "ERROR: Root Gradle build file not found."
            exit 1
          fi

          echo "Android project structure verified."

          echo "Checking MainActivity files:"
          find . -type f \
            \( -name MainActivity.kt \
            -o -name MainActivity.java \)

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully: $APK"

          mkdir -p "$RUNNER_TEMP/apk-check"

          unzip -l "$APK" > "$RUNNER_TEMP/apk-check/files.txt"

          echo "Checking APK contents..."

          if grep -q 'classes.dex' \
            "$RUNNER_TEMP/apk-check/files.txt"; then
            echo "DEX bytecode found."
          else
            echo "WARNING: classes.dex not found."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuHamzaStore-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
